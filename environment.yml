# Exported from the live, actually-verified WideFlow1 env (see CLAUDE.md's Environment section).
# conda env export's built-in pip-freeze step is unreliable on this env (silently dropped ~210 of
# 225 pip packages, incl. tensorflow/torch/napari/deeplabcut) — this file's pip section was built
# from 'conda run -n WideFlow1 pip freeze' directly instead.
#
# NOTE: the 'wideflow' package itself is deliberately NOT listed below. It's installed separately
# as an editable install pointing at your local WideFlow checkout:
#   pip install -e /path/to/WideFlow
# (pip freeze reported it as an unrelated stale 'git+https://github.com/PBLab/WideFlow.git@<hash>'
# reference, which does not reflect how it's actually installed here.)
